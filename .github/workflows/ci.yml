name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - run: go vet ./...
      - run: go test ./... -race

  # Builds and pushes the image only when a commit lands on main (i.e. a merge),
  # never on pull_request or tag pushes.
  # Requires two repo secrets before this job can run:
  #   - secrets.WIF_PROVIDER (Workload Identity Federation provider)
  #   - secrets.WIF_SERVICE_ACCOUNT (service account with Artifact Registry Writer on
  #     australia-southeast1-docker.pkg.dev/field-engineering-apac)
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/f5-guardrail-webhook
    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/login-action@v4
        with:
          registry: australia-southeast1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
